spring.application.name=chatbot
# Cấu hình H2 Database được tạo bằng Java để không phụ thuộc vào thư mục chạy hiện tại.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Tự động tạo bảng từ Entity
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Port chạy server
server.port=8081

# JWT secret (ít nhất 32 ký tự cho HS256)
jwt.secret=chatbot-jwt-secret-key-please-change-this-for-production-2026

# FastAPI RAG server
rag.apiUrl=http://localhost:8000
rag.timeoutMs=240000