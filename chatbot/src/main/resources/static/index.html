<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCare AI — Nutrition &amp; Health Advisor</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="icon-btn menu-btn" id="menu-toggle" title="Toggle menu">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>

        <button class="nav-item new-chat-btn" id="new-chat-btn">
            <span class="material-symbols-outlined">add</span>
            <span class="nav-text">New chat</span>
        </button>

        <div class="recent-section" id="recent-section">
            <div class="recent-title">Recent</div>
            <div id="chat-history-list"></div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="app-name">NutriCare AI</div>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" id="theme-toggle" title="Toggle light/dark mode">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
                <div class="avatar" id="avatar-btn" title="Account">
                    <img src="https://ui-avatars.com/api/?name=User&background=random" alt="Avatar">
                </div>
            </div>
        </header>

        <div class="profile-popup" id="profile-popup">
            <div class="profile-header">
                <img id="popup-avatar" src="" alt="Avatar">
                <div class="profile-name" id="popup-fullname">Hello,</div>
            </div>

            <div class="profile-actions">
                <button class="action-btn" id="logout-btn">
                    <span class="material-symbols-outlined">logout</span> Log out
                </button>
            </div>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="welcome-area" id="welcome-area">
                <div class="welcome-icon">
                    <span class="material-symbols-outlined">nutrition</span>
                </div>
                <div class="greeting">
                    <h1 id="greeting-headline">Hello!</h1>
                    <h2>How can I help you today?</h2>
                </div>
            </div>
            <div class="messages-wrapper" id="messages-wrapper"></div>
        </div>

        <div class="bottom-area">
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Ask me anything about nutrition..." rows="1"></textarea>
                <button class="icon-btn send-btn" id="send-btn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal"><span class="material-symbols-outlined">close</span></button>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">Log In</button>
                <button class="auth-tab" id="tab-register">Register</button>
            </div>

            <form id="login-form" class="auth-form active">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Log In</button>
                <p class="auth-msg" id="login-msg"></p>
            </form>

            <form id="register-form" class="auth-form">
                <input type="text" id="reg-fullname" placeholder="Full Name" required>
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Register</button>
                <p class="auth-msg" id="reg-msg"></p>
            </form>
        </div>
    </div>

    <script src="/js/marked.min.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
